spring.application.name=cerbere-devices-mock

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=cerbere_devices_mock

cerbere.devices-mock.mqtt.broker-url=tcp://localhost:1883
cerbere.devices-mock.mqtt.client-id=cerbere-devices-mock
cerbere.devices-mock.mqtt.base-topic=zigbee2mqtt

# Période de reporting des devices simulés (voir ADR 0024) : chaque device joignable
# republie son état courant, ce qui entretient le lastSeenAt de cerbere-core. Doit
# rester nettement inférieur à cerbere.core.device-heartbeat.timeout-ms (5 min par
# défaut) pour qu'un device vivant ne soit jamais marqué injoignable à tort.
cerbere.devices-mock.heartbeat.fixed-delay-ms=60000

server.port=8081
